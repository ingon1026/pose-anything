services:
  perception:
    build: .
    # ⚠ build 와 image 가 둘 다 있고 pull_policy 가 없으면, Compose 는 **먼저
    # pull 을 시도하고** 레지스트리에서 못 찾을 때만 빌드한다(Compose 사양,
    # build.md "Using build and image"). 즉 소스를 고쳐도 `docker compose up`
    # 은 Hub 이미지를 받아 돌린다 — 조용히, 아무 표시 없이.
    # (`pull_policy: missing` 은 **해결책이 아니다** — 2026-08-31 실측으로 기본값과
    #  동작이 같았다. 로컬에 있으면 둘 다 안 받고, 없으면 둘 다 받으려다 빌드한다.)
    # ⚠ **태그를 아키텍처가 가른다.** Hub 의 `latest` 와 `1.3.0` 은 **amd64 전용**
    # 이다(2026-08-31 `docker manifest inspect` 확인 — `linux/amd64` 하나뿐).
    # arm64(DGX Spark)에서 그냥 두면 여기서 깨진다. `.env` 에
    # `IMAGE_TAG=1.3.0-arm64` 를 넣고 로컬 빌드를 쓸 것.
    image: ingon1026/pose-anything:${IMAGE_TAG:-latest}
    network_mode: host        # 호스트 ROS 노드와 DDS 통신
    ipc: host
    privileged: true          # RealSense USB 접근 (bag만 쓰면 제거 가능)
    # 공유 서버용. 이게 없으면 컨테이너가 root 로 돌아 바인드 마운트에 쓰는
    # 파일(./output 의 CSV·mp4, HF 캐시)이 전부 root 소유가 되어 본인도 못 지운다.
    # ⚠ **`UID` 는 bash 내부 변수라 export 되지 않고, `GID` 는 bash 에 아예 없다.**
    # Compose 는 환경변수와 `.env` 만 보므로 그냥 두면 **경고 없이 항상 1000:1000**
    # 이 된다(2026-08-31 `docker compose config` 로 실측). uid 가 1000 이 아니면
    # 둘 중 하나를 쓸 것 — **둘 다 실측 확인함**:
    #   export UID; export GID=$(id -g)      # 그 셸에서 계속 유효
    #   printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" >> .env
    # ⚠ **`>` 로 덮지 말 것.** `.env` 에는 이제 `HF_TOKEN`·`IMAGE_TAG` 도 들어가서
    # 잘라쓰면 그것들이 조용히 날아간다. 토큰은 `scripts/set_hf_token.sh` 가
    # 다른 키를 보존하며 갱신한다.
    # ⚠ **`.env` 는 이제 `.gitignore` 에 있다**(2026-08-31 확인) — `HF_TOKEN` 을
    # 적어도 커밋되지 않는다. 토큰은 `scripts/set_hf_token.sh` 로 넣으면
    # 유효성과 `facebook/sam3` 게이트까지 확인한 뒤 기록한다.
    # ⚠ **`UID=$(id -u) GID=$(id -g) docker compose ...` 는 쓰지 말 것.** bash 에서
    # `UID` 는 readonly 라 `UID: readonly variable` 을 뱉는데 — **거기서 죽지 않고
    # 명령은 그대로 실행된다**(2026-08-31 실측: 종료코드 0, `GID` 만 환경에 실림).
    # 결과는 uid 만 기본값 1000 으로 떨어지고 gid 는 본인 것인 뒤섞인 소유권이다.
    # **경고처럼 보이는 줄 하나만 남는 무성 실패**라 위 `.env` 쪽이 안전하다.
    # ⚠ **RealSense 라이브 경로는 이 줄을 켜면 깨진다** — `/dev/bus/usb` 노드가
    # root 소유라 위 privileged 여도 non-root 프로세스는 effective capability 가
    # 비어 있어 DAC 우회가 안 된다. **카메라를 쓸 때는 이 줄을 지울 것**
    # (bag 재생·헤드리스는 무관하고, 공유 서버 용도가 그쪽이라 기본값을 켜 둔다).
    # ⚠ 아래 마운트 대상(`./output`, HF 캐시 디렉터리)이 **호스트에 없으면**
    # Docker 가 root 소유로 만들어 첫 쓰기가 막힌다 — 먼저 `mkdir -p` 할 것.
    # ⚠ **있어도 막힐 수 있다.** `~/.cache/huggingface` 는 `drwx------`(0700) 이라
    # uid 가 안 맞으면 캐시를 못 읽고 SAM3 3.3GB 를 매번 다시 받으려다 그것도
    # 실패한다 — 공유 캐시를 쓰는 이유가 이것이다(shared_server §5).
    # ⚠ **확인됨(2026-08-31 실행)** — uid 가 이미지의 `/etc/passwd` 에 없으면
    # `HOME` 이 `/` 로 잡히는 정도가 아니라 **SAM3 import 자체가 죽는다**:
    #   KeyError: 'getpwuid(): uid not found: 1008'
    #   modeling_sam3.py:29 → torchvision/ops/poolers.py → getpass.getuser()
    # 이미지에는 uid **1000(`ubuntu`)만** 있어서 기본값은 우연히 통과하지만,
    # 위 안내대로 자기 uid 를 넣는 순간 걸린다 — **소유권을 고치는 조치가
    # 컨테이너를 깨뜨린다.** 아래 environment 의 `USER`·`HOME` 이 그걸 막는다.
    # (`ROS_HOME=/tmp/ros` 로는 안 풀린다 — import 단계라 더 앞이다.)
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    tty: true
    environment:
      - HF_TOKEN              # gated facebook/sam3 다운로드용 (호스트 env 전달)
      - DISPLAY=${DISPLAY:-:0}
      # 위 `user:` 주석의 uid 문제를 막는 두 줄. `getpass.getuser()` 는 pwd 를
      # 뒤지기 **전에** LOGNAME·USER·LNAME·USERNAME 을 먼저 보므로, 값이 있기만
      # 하면 uid 가 이미지 passwd 에 없어도 통과한다(2026-08-31 실행 확인).
      - USER=${USER:-ubuntu}
      - HOME=/tmp             # uid 미등록 시 HOME 이 `/` 가 되어 ~/.ros/log 가 막힌다
      # 계약서 §1.1. 컨테이너에는 호스트 .bashrc 가 없어 상속받을 곳이 아예 없다 —
      # 위 network_mode: host 로 호스트 ROS 노드와 DDS 로 붙는데 이게 없으면
      # 기본 UDP 가 되어 에러 없이 데이터가 안 온다. scripts/ros_env.sh 와 같은 값.
      - FASTDDS_BUILTIN_TRANSPORTS=LARGE_DATA?max_msg_size=190KB&sockets_size=200KB&non_blocking=true&tcp_negotiation_timeout=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/cache/hf   # 모델 캐시 (재다운로드 방지)
      - ./bags:/ws/bags
      - ./output:/ws/output
      - /tmp/.X11-unix:/tmp/.X11-unix                # RViz·디버그 창 (headless면 불필요)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
