name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime libs
        run: sudo apt-get update && sudo apt-get install -y libgl1 libgomp1
      - name: Install python deps
        # torch/SAM3 불필요 — geometry·tracker·pipeline 단위 테스트만 실행
        run: pip install numpy scipy opencv-python-headless open3d pillow pytest
      - name: Run unit tests
        # ⚠ rclpy 가 없으므로 test_perception_node.py 23개는 skip 된다
        # (importorskip). 그러면 "118 passed, 23 skipped" 로 **초록불**이라,
        # 노드 회귀는 CI 가 못 잡는다 - 영구 락아웃(LATE_DROP_STREAK_MAX
        # 우회)이 정확히 그 부류다. 노드를 고쳤으면 rclpy 가 있는 곳에서
        # 141 을 직접 확인할 것. -rs 로 skip 사유를 로그에 남긴다.
        run: pytest src/roboworld_perception/test -q -rs
